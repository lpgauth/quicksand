name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"
  # Build every target on PRs that touch native code, without publishing.
  pull_request:
    paths:
      - "native/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Cross.toml"
      - ".cargo/**"
      - ".github/workflows/release.yml"

jobs:
  create_release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --draft

  build_release:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }} (${{ matrix.job.os }})
    needs: create_release
    # Run on PRs too, where create_release is skipped.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ${{ matrix.job.os }}

    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        nif: ["2.15"]
        job:
          - { target: aarch64-apple-darwin,        os: macos-15 }
          - { target: aarch64-unknown-linux-gnu,   os: ubuntu-22.04, use-cross: true }
          - { target: aarch64-unknown-linux-musl,  os: ubuntu-22.04, use-cross: true }
          - { target: x86_64-apple-darwin,         os: macos-15 }
          - { target: x86_64-unknown-linux-gnu,    os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl,   os: ubuntu-22.04, use-cross: true }

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Extract project version
        shell: bash
        run: |
          echo "PROJECT_VERSION=$(sed -n 's/^  @version "\(.*\)"/\1/p' mix.exs | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.job.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v0-precomp
          shared-key: ${{ matrix.job.target }}-${{ matrix.nif }}

      - name: Install cross
        if: matrix.job.use-cross
        shell: bash
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build native library
        shell: bash
        run: |
          if [ "${{ matrix.job.use-cross }}" = "true" ]; then
            RUSTLER_NIF_VERSION=${{ matrix.nif }} cross build --release --target ${{ matrix.job.target }} --package quicksand
          else
            RUSTLER_NIF_VERSION=${{ matrix.nif }} cargo build --release --target ${{ matrix.job.target }} --package quicksand
          fi

      - name: Package artifact
        shell: bash
        run: |
          TARGET=${{ matrix.job.target }}
          VERSION=${{ env.PROJECT_VERSION }}
          NIF=${{ matrix.nif }}

          if [[ "$TARGET" == *"darwin"* ]]; then
            LIB_FILE="target/${TARGET}/release/libquicksand.dylib"
          else
            LIB_FILE="target/${TARGET}/release/libquicksand.so"
          fi

          # RustlerPrecompiled expects the file inside the archive to match this name
          NIF_NAME="libquicksand-v${VERSION}-nif-${NIF}-${TARGET}.so"
          cp "${LIB_FILE}" "${NIF_NAME}"

          ARCHIVE_NAME="${NIF_NAME}.tar.gz"
          tar -czf "${ARCHIVE_NAME}" "${NIF_NAME}"
          echo "ARCHIVE_NAME=${ARCHIVE_NAME}" >> $GITHUB_ENV

      - name: Upload to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.ref_name }}" "${{ env.ARCHIVE_NAME }}" --clobber
