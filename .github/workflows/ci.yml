name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  MIX_ENV: test
  QUICKSAND_BUILD: true

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - run: mix deps.get
      - run: mix format --check-formatted
      - run: cargo fmt --check
      - run: cargo clippy -- -D warnings

  test:
    name: Test (OTP ${{ matrix.otp }} / Elixir ${{ matrix.elixir }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            otp: "27"
            elixir: "1.18"
          - os: ubuntu-latest
            otp: "26"
            elixir: "1.17"
          - os: macos-14
            otp: "27"
            elixir: "1.18"
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: ${{ matrix.otp }}
          elixir-version: ${{ matrix.elixir }}

      - uses: dtolnay/rust-toolchain@stable

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test

  dialyzer:
    name: Dialyzer
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.18"

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: _build/dev/*.plt*
          key: plt-${{ runner.os }}-otp27-elixir1.18-${{ hashFiles('mix.lock') }}
          restore-keys: plt-${{ runner.os }}-otp27-elixir1.18-

      - run: mix deps.get
      - run: mix dialyzer
