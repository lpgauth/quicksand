[package]
name = "quicksand"
version = "0.1.0"
edition = "2021"

[lib]
name = "quicksand"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.37", default-features = false, features = ["big_integer", "derive", "nif_version_2_15"] }
rquickjs = { version = "0.14", features = ["bindgen", "parallel"] }

# Google Rust style guide rules that clippy can check.
[lints.clippy]
cast_lossless = "warn"
match_same_arms = "warn"
or_fun_call = "warn"
redundant_closure_for_method_calls = "warn"
trivially_copy_pass_by_ref = "warn"
uninlined_format_args = "warn"
unwrap_used = "warn"
wildcard_imports = "warn"
